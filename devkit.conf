# shellcheck shell=bash
# StartOpenRGB's settings for the devkit (scripts/devkit, a submodule; see omarchy-plugin-devkit docs/configuration.md).
TOUR_PLUGIN_ID=io.github.bmaltais.startopenrgb
DEVKIT_NAME=startopenrgb
DEVKIT_LAYERS=(omarchy-startopenrgb)
DEVKIT_ENV=(STARTOPENRGB_DEMO=1)   # the CLI serves fixture devices and runs no openrgb command
TOUR_REAL_UNCHANGED=(.config/omarchy/shell.json .config/startopenrgb)

DEVKIT_USAGE='  dev open | close   show or hide the window there'
dev_cmd_open() { dev_window open "$TOUR_PLUGIN_ID" open; }
dev_cmd_close() { nenv omarchy-shell "$TOUR_PLUGIN_ID" close >/dev/null; echo "dev close: closed"; }
